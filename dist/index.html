<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Novyra AI | Automação Inteligente para Empresas</title>
    <meta
      name="description"
      content="Conheça a Novyra AI e descubra como a inteligência artificial pode ajudar sua empresa a organizar o atendimento pelo WhatsApp."
    />
    <meta name="theme-color" content="#050608" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Novyra AI" />
    <meta property="og:title" content="Novyra AI | Automação Inteligente para Empresas" />
    <meta
      property="og:description"
      content="Conheça a Novyra AI e descubra como a inteligência artificial pode ajudar sua empresa a organizar o atendimento pelo WhatsApp."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da Novyra AI: símbolo N prateado com luz azul sobre fundo escuro." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/og-image.jpg" />
    

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonte: Inter (carregamento eficiente, com fallback de sistema) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Prioridade de carregamento da logo do cabeçalho / hero -->
    <link rel="preload" as="image" href="/images/logo-symbol.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logo-wordmark.webp" type="image/webp" />
    <link rel="stylesheet" href="/assets/main.css" />
    <script type="module" src="/assets/main.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;color:#F5F7FA;font-family:system-ui,sans-serif">
        Novyra AI — ative o JavaScript para visualizar esta página.
      </p>
    </noscript>
  </body>
</html>
